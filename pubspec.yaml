name: orblit_editor
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  file_selector: ^1.0.3
  vector_math: ^2.1.4

  # A path dependency while the renderer and the editor change together: a
  # git dependency here would mean a push and a pub upgrade between writing a
  # renderer change and seeing it. Assumes the sibling checkout in
  # ChxisB/orblit.
  orblit_filament:
    path: ../orblit/packages/orblit_filament
  orblit_weather:
    path: ../orblit/packages/orblit_weather

  # The cook: what each asset is, whether the cache already holds it for this
  # machine, and why one would not cook. The browser only *asks* -- the answer
  # has to come from the same cache and the same importers the build uses, or
  # a mark beside an asset would eventually disagree with the build it is
  # meant to describe.
  orblit_asset:
    path: ../orblit/packages/orblit_asset

  # The scene format itself, which used to live in this file and now does not.
  # One reader, one writer and one list of migrations, shared with the runtime
  # and with anything else that opens a scene -- the editor is where they are
  # authored, not where they are defined.
  orblit_scene:
    path: ../orblit/packages/orblit_scene

  # Where a light's watts, metres and degrees become the lumens, lux and
  # radians a renderer takes. The editor authors the first and sends the
  # second, and converting in both places is how the two drift apart.
  orblit_light:
    path: ../orblit/packages/orblit_light

  # Compiling a C++ script, and the header it is compiled against. The editor
  # only builds and checks; loading and running one is the runtime's job, and
  # the same package does both so the thing the editor checks against is the
  # thing the runtime loads.
  orblit_native:
    path: ../orblit/packages/orblit_native

  # The interface model and the widgets it builds. The same package a game
  # draws its interface with, so what the canvas shows is what ships.
  orblit_ui:
    path: ../orblit/packages/orblit_ui

  # Geometry built in the editor. The shapes, and the operations that turn one
  # into something that was not a shape any more.
  orblit_mesh:
    path: ../orblit/packages/orblit_mesh

  # Clips: the file the timeline edits, and the sampling that shows one on
  # the scene. The runtime plays the same file through the same code, so a
  # scrub here is what the game does at that moment.
  orblit_motion:
    path: ../orblit/packages/orblit_motion

  # Ground: the files a terrain is kept in, the brushes that shape it and
  # the undo record a stroke leaves. The runtime reads the same files and
  # stands on the same heights, so what is sculpted here is what is walked
  # on there.
  orblit_terrain:
    path: ../orblit/packages/orblit_terrain

  # Only for turning a terrain into what the renderer draws, which the
  # runtime does through the same function. Two conversions would be two
  # answers to how a set's pictures reach the GPU.
  orblit_stage:
    path: ../orblit/packages/orblit_stage

  # The worked examples, shown in the launcher beside the projects. The same
  # package the gallery app uses, so an example only has to be written once
  # and the editor never drifts from what the gallery shows.
  orblit_examples:
    path: ../orblit/packages/orblit_examples
  path: ^1.9.0
  path_provider: ^2.1.5

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/brand/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
