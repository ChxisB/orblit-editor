name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The packages come from two other repositories, which CI packs into a
  # local feed. A branch with this branch's name in one of them is its pair,
  # so a change here and the change it needs build together. Without one the
  # repository's default branch is used.
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: orblit-editor

      - id: pair
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in orblit orblit-net; do
            key=${repo//-/_}
            if git ls-remote --exit-code --heads \
                "https://github.com/ChxisB/$repo.git" "$BRANCH" > /dev/null; then
              echo "Building against ChxisB/$repo@$BRANCH"
              echo "$key=$BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "No matching $repo branch; using its default"
              echo "$key=" >> "$GITHUB_OUTPUT"
            fi
          done

      # No token: these repositories are public, so the default GITHUB_TOKEN
      # reads them.
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit
          ref: ${{ steps.pair.outputs.orblit }}
          path: orblit
      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit-net
          ref: ${{ steps.pair.outputs.orblit_net }}
          path: orblit-net

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: orblit-editor/dotnet/global.json

      # The runner context exists in a step and not in a job's env, so the
      # feed folder is named on each step that reads it.
      # The packages carry the native core only if it is built before they are
      # packed.
      - name: Build the engine natives
        shell: bash
        working-directory: orblit
        run: tool/build_native.sh

      - name: Pack the engine
        shell: bash
        working-directory: orblit
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: tool/pack_local.sh

      - name: Pack networking
        shell: bash
        working-directory: orblit-net
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: |
          dotnet pack dotnet/Orblit.Net -c Release -o "${{ runner.temp }}/feed" --nologo -v q
          dotnet pack dotnet/Orblit.Net.Game -c Release -o "${{ runner.temp }}/feed" --nologo -v q

      - name: Check
        shell: bash
        working-directory: orblit-editor
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: tool/check_dotnet.sh

  # Checks each commit on a pull request against commitlint.config.mjs.
  # Pull requests only, since a push to main has no range to check. It
  # checks out the branch head, not the merge commit GitHub makes, so the
  # range holds the branch's own commits and nothing else.
  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @commitlint/cli@21 --from "origin/$BASE_BRANCH" --to HEAD
        env:
          BASE_BRANCH: ${{ github.base_ref }}
